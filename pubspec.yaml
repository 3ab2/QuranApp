name: quran_app

description: Application islamique complète (Adhan, Quran, Tafsir, Stories)

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.1
  just_audio: 0.10.5
  audio_session: ^0.1.25
  geolocator: 13.0.4
  geocoding: ^3.0.0
  flutter_local_notifications: ^17.0.0
  audio_service: ^0.18.0
  path_provider: ^2.1.0
  arabic_numbers: ^1.0.0
  intl: 0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  timezone: ^0.9.2
  flutter_timezone: ^5.0.2
  google_fonts: ^6.1.0
  hijri: ^3.0.0
  dio: ^5.4.0
  path: ^1.9.0
  universal_html: ^2.2.4
  idb_shim: ^2.4.0
  scrollable_positioned_list: ^0.3.8
  url_launcher: ^6.3.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/sounds/adhan/
    - assets/images/